<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css" integrity="sha512-1sCRPdkRXhBV2PBLUdRb4tMg1w2YPf37qatUFeS7zlBy7jJI8Lf4VHwWfZZfpXtYSLy85pkm9GaYVYMfw5BC1A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<script src="https://s0.2mdn.net/ads/studio/cached_libs/gsap_3.5.1_min.js"></script>
<meta name="ad.size" content="width=300,height=600">
<meta charset="UTF-8">
<style type="text/css">
body {
	margin: 0px;
}
#container {
	width:300px;
	height:600px;
	overflow: hidden;
	position: absolute;
	background: linear-gradient(rgba(0,176,185,1) 10%, rgba(0,42,92,1) 40%);
	display: none;
}
#clicktag {
    width: 100%;
    height: 100%;
    z-index: 300;
    position: absolute;
    display: block;
    cursor: pointer;
}
#idbox2 div {
	position: absolute;
}
#idbox img {
	width:100%;
	height:100%;
}
#idbox {
	position: absolute;
	width:550px;
	height:520px;
	/*display: none;*/
	/*overflow: hidden;*/
	left:-125px;
	top:40px;
}
#front {
	position: absolute;
	width:300px;
	height:286px;
	overflow: hidden;
	padding:30px;
	top: 50%;
	left: 50%;
	transform: translate(-50%, -50%);
}
#frame {
	width: calc(100% - 60px);
	height: calc(100% - 60px);
	outline: 30px solid #00B0B9;
	position: absolute;
}
#frontimage {
	position: absolute;
	width: calc(100% - 60px);
	height: calc(100% - 60px);
}
#elements div {
	position: absolute;
	width:100%
	height:100%;
}
#button {
	position: absolute;
	background: linear-gradient(45deg,rgba(0,176,185,1) -60%, rgba(0,42,92,1) -40%, rgba(0,176,185,1) -20%);
	padding: 5px 8px 5px 8px;
	background-color: #00B0B9;
	left:39px;
	bottom:120px;
}
#headline {
	position: absolute;
}
#logo {
	top:10px;
}
#play {
	width: 300px;
	height: 600px;
	background-color: black;
	position: absolute;
	cursor: pointer;
	background: linear-gradient(rgba(0,0,0,.7), rgba(0,0,0,.7)), url("203835-UofT-Personal-300x600-EN.jpg");
}
#playbutton {
	width: 40px;
	height: 40px;
	background-color: white;
	border-radius: 30px;
	position: absolute;
	  left: 50%;
  top: 50%;
  -webkit-transform: translate(-50%, -50%);
  transform: translate(-50%, -50%);
}
#playbutton i {
	position: absolute;
	  left: 50%;
  top: 50%;
  -webkit-transform: translate(-50%, -50%);
  transform: translate(-50%, -50%);
}
</style>
</head>
<body>
<div id="container">
	<div id="idbox">
		<div id="backimage"><img src="image-back.jpg"/></div>
		<div id="front"><div id="frontimage"><img src="image-front.jpg"/></div><div id="frame"></div></div>
		<div id="headline"><img src="personal-headline.svg"/></div>
	</div>
	<div id="elements">
		<div id="copy"><img src="personal-copy.svg"/></div>
		<!-- <div id="headline"><img src="generic-headline.svg"/></div> -->
		<div id="logo"><img src="logo.svg"/></div>
	</div>
	<div id="clicktag"></div>
	<div id="button"><img src="button-txt.svg"/></div>
</div>
<div id="play">
	<div id="playbutton"><i class="fa-solid fa-circle-play fa-2xl"></i></div>
</div>
<script type="text/javascript">
var clickTag = "http://www.google.com";
document.getElementById("play").onclick = function() {
document.getElementById("container").style.display = "block";
document.getElementById("play").style.display = "none";
var mainTimeline = new TimelineMax();
mainTimeline
.set ("#headline",{scale:2.17,x:125,y:-220})
.to ("#idbox",6,{ease:Power2.easeInOut,scale:0.46,y:-157,force3D:false},"intro")
.fromTo ("#headline",6,{y:100},{y:-220, ease:Power2.easeInOut},"intro")
.from ("#frontimage",5,{ease:Power2.easeInOut,scale:1.5,force3D:false},"intro")
.from ("#backimage",6,{ease:Power2.easeInOut,scale:2,force3D:false},"intro")
.from ("#copy",1,{ease:Power2.easeInOut,x:-300},"endframe-=1.3")
.from ("#logo",0.8,{ease:Power2.easeInOut,opacity:0},"endframe-=0.5")
.from ("#button",1,{ease:Power2.easeInOut,x:-200},"endframe+=0.2")
.set ("#button",{backgroundImage:"linear-gradient(45deg,rgba(0,176,185,1) -60%, rgba(154,229,233,1) -40%, rgba(0,176,185,1) -20%"})
.to ("#button",1.8,{ease:Power2.easeInOut,backgroundImage:"linear-gradient(45deg,rgba(0,176,185,1) 140%, rgba(154,229,233,1) 160%, rgba(0,176,185,1) 180%)"})
;
//mainTimeline.seek ("intro+=40")
};
document.getElementById("clicktag").onclick = function() {
    window.open(window.clickTag)
}
document.getElementById("clicktag").onmouseover = function() {
	var buttonRollover = new TimelineMax();
	buttonRollover
	.set ("#button",{backgroundImage:"linear-gradient(45deg,rgba(0,176,185,1) -60%, rgba(154,229,233,1) -40%, rgba(0,176,185,1) -20%"})
	.to ("#button",1.8,{ease:Power2.easeInOut,backgroundImage:"linear-gradient(45deg,rgba(0,176,185,1) 140%, rgba(154,229,233,1) 160%, rgba(0,176,185,1) 180%)"})
;
}
</script>
</body>
</html>
