    <!-- Freeform layouts on the page grid (one cell = one cell of the logo).
         Two layouts, picked by the window's width: wide (68 cells across)
         and, below 1100px, narrow (51 cells). Phones get one stacked column.
         Each card's style places it in both:
           --x  --y  --w  --h    wide
           --nx --ny --nw --nh   narrow
         x is the column and y the row, counted from the logo's top-left
         corner; w and h are the size; all in cells. Where cards overlap, the
         later one sits on top, unless --z (wide) / --nz (narrow) says
         otherwise. Cards marked data-autoplay play by themselves on desktop;
         the rest play while hovered. The layout editor (press E, on a local copy served by
         tools/layout-server.py) edits these numbers for you. -->
