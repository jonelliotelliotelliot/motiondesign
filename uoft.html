<!DOCTYPE html>
<html lang="en">
<head>
    <title>jonelliot - uoft</title>
    <link rel="stylesheet" href="css/style.css?v=1.0">
    <script src="js/head.js" defer></script>
</head>
<body>
    <div id="navbar-placeholder"></div>
    <div id="header-placeholder"></div>
    <div id="heading"><h1>university of toronto</h1><p>social videos</p></div>

    <main class="project-container">
        <div class="project-component">
            <div class="media-container">
                <div class="media-item interactive-video">
                    <video data-src="assets/projects/uoft/UOT_Video_30E_2023-YT.webm" data-poster-time="6" playsinline></video>
                     <div class="play-button-overlay"><i class="fa-solid fa-play"></i></div>
                </div>
            </div>
            <!-- <div class="component-description">Final render of the primary scene</div> -->
        </div>

         <div class="project-component">
            <div class="media-container two-column">
                <div class="media-item">
                    <video data-src="assets/projects/uoft/chatgpt-prompt.webm" autoplay muted loop playsinline></video>

                </div>
                <div class="media-item">
                    <video data-src="assets/projects/uoft/chatgpt-arrows.webm" autoplay muted loop playsinline></video>

                </div>
            </div>
            <!-- <div class="component-description">Side-by-side comparison of final render and wireframe.</div> -->
        </div>

        <div class="project-component">
            <div class="media-container">
                <div class="media-item interactive-video">
                    <video data-src="assets/projects/uoft/datascience.webm" data-poster-time="3" playsinline></video>
                     <div class="play-button-overlay"><i class="fa-solid fa-play"></i></div>
                </div>
            </div>
        </div>

       <div class="project-component">
            <div class="media-container">
                <div class="media-item interactive-video">
                    <video data-src="assets/projects/uoft/1920x1080-uoft-fallcampaign-15sec.webm" data-poster-time="2" playsinline></video>
                     <div class="play-button-overlay"><i class="fa-solid fa-play"></i></div>
                </div>
            </div>
        </div>
    </main>

<script src="js/main.js?v=1.0"></script>

</body>
</html>
