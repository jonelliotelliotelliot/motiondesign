<!DOCTYPE html>
<html lang="en">
<head>
    <title>jonelliot - chartwell</title>
    <link rel="stylesheet" href="css/style.css?v=1.0">
    <script src="js/head.js" defer></script>
</head>
<body>
    <div id="navbar-placeholder"></div>
    <div id="header-placeholder"></div>
    <div id="heading"><h1>chartwell</h1><p>broadcast & logo animation</p></div>

    <main class="project-container">
        <div class="project-component">
            <div class="media-container">
                <div class="media-item interactive-video">
                    <video data-src="assets/projects/chartwell/watercolour.webm" autoplay loop muted playsinline></video>
                    <div class="play-button-overlay"><i class="fa-solid fa-play"></i></div>
                </div>
            </div>
            <!-- <div class="component-description">Final render of the primary scene</div> -->
        </div>


        <div class="project-component">
            <div class="media-container two-column">
                <div class="media-item">
                    <video data-src="assets/projects/chartwell/logo-fly.webm" autoplay loop muted playsinline></video>
                </div>
                <div class="media-item">
                    <video data-src="assets/projects/chartwell/logo-zoom.webm" autoplay loop muted playsinline></video>
                </div>
            </div>
            <!-- <div class="component-description">Side-by-side comparison of final render and wireframe.</div> -->
        </div>

         <div class="project-component">
            <div class="media-container">
                <div class="media-item interactive-video">
                    <video data-src="assets/projects/chartwell/starrynight.webm" data-poster-time="0" playsinline></video>
                    <div class="play-button-overlay"><i class="fa-solid fa-play"></i></div>
                </div>
            </div>
            <!-- <div class="component-description">Final render of the primary scene</div> -->
        </div>

    </main>

<script src="js/main.js?v=1.0"></script>
</body>
</html>
