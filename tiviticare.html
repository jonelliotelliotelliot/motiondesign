<!DOCTYPE html>
<html lang="en">
<head>
    <title>jonelliot - tiviticare</title>
    <link rel="stylesheet" href="css/style.css?v=1.0">
    <script src="js/head.js" defer></script>
</head>
<body>
    <div id="navbar-placeholder"></div>
    <div id="header-placeholder"></div>
    <div id="heading"><h1>tiviticare</h1><p>social videos</p></div>

    <main class="project-container">
        <div class="project-component">
            <div class="media-container">
                <div class="media-item interactive-video">
                    <video data-src="assets/projects/tiviticare/tiviti-help.webm" loop muted playsinline></video>
                    <div class="play-button-overlay"><i class="fa-solid fa-play"></i></div>
                </div>
            </div>
            <!-- <div class="component-description">Final render of the primary scene</div> -->
        </div>

        <div class="project-component">
            <div class="media-container two-column">
                <div class="media-item">
                    <video data-src="assets/projects/tiviticare/tiviti-spin.webm" autoplay loop muted playsinline></video>

                </div>
                <div class="media-item interactive-video">
                    <video data-src="assets/projects/tiviticare/tiviti-connect.webm" loop muted playsinline></video>
                    <div class="play-button-overlay"><i class="fa-solid fa-play"></i></div>
                </div>
            </div>
            <!-- <div class="component-description">Side-by-side comparison of final render and wireframe.</div> -->
        </div>

         <div class="project-component">
            <div class="media-container">
                <div class="media-item interactive-video">
                    <video data-src="assets/projects/tiviticare/tiviticare-final-1920x1080-EN-OC.webm" data-poster-time="13" playsinline></video>
                    <div class="play-button-overlay"><i class="fa-solid fa-play"></i></div>
                </div>
            </div>
            <!-- <div class="component-description">Final render of the primary scene</div> -->
        </div>

    </main>

<script src="js/main.js?v=1.0"></script>
</body>
</html>
