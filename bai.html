<!DOCTYPE html>
<html lang="en">
<head>
    <title>jonelliot - bai</title>
    <link rel="stylesheet" href="css/style.css?v=1.0">
    <script src="js/head.js" defer></script>
</head>
<body>
    <div id="navbar-placeholder"></div>
    <div id="header-placeholder"></div>
    <div id="heading"><h1>bai vitamin water</h1><p>social videos</p></div>

    <main class="project-container">
        <div class="project-component">
            <div class="media-container">
                <div class="media-item interactive-video">
                    <video data-src="assets/projects/bai/bai-matrix-en.webm" data-poster-time="2" playsinline></video>
                     <div class="play-button-overlay"><i class="fa-solid fa-play"></i></div>
                </div>
            </div>
            <!-- <div class="component-description">Final render of the primary scene</div> -->
        </div>

        <div class="project-component">
            <div class="media-container">
                <div class="media-item">
                    <video data-src="assets/projects/bai/bai-spin-rd.webm" autoplay loop muted playsinline></video>
                </div>
            </div>
            <!-- <div class="component-description">Final render of the primary scene</div> -->
        </div>

        <div class="project-component">
            <div class="media-container two-column">
                <div class="media-item interactive-video">
                    <video data-src="assets/projects/bai/bai-big.webm" data-poster-time="2" loop muted playsinline></video>
                    <div class="play-button-overlay"><i class="fa-solid fa-play"></i></div>
                </div>
                <div class="media-item interactive-video">
                    <video data-src="assets/projects/bai/bai-moon.webm" loop muted playsinline></video>
                    <div class="play-button-overlay"><i class="fa-solid fa-play"></i></div>
                </div>
            </div>
            <!-- <div class="component-description">Side-by-side comparison of final render and wireframe.</div> -->

<script src="js/main.js?v=1.0"></script>
